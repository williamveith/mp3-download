<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}" />
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='images/favicon.png') }}" />
    <title>YouTube2MP3</title>
  </head>
  <body>
    <form action="/download-template" method="GET">
      <button type="submit">Download Template</button>
    </form>
    <form action="/upload-list" method="POST" enctype="multipart/form-data">
      <span>
        <input type="file" name="file" accept=".csv" required/>
      </span>
      <button type="submit">Upload List</button>
    </form>
    <form
      id="metadataform"
      action="/update-metadata"
      method="POST"
      enctype="multipart/form-data">
      <span>
        <input type="file" name="file" required/>
      </span>
      <span>
        <label for="title">Title</label>
        <input id="title" type="text" name="title" required/>
      </span>
      <span>
        <label for="author">Author</label>
        <input id="author" type="text" name="author" required/>
      </span>
      <button type="submit">Update Metadata</button>
    </form>
  </body>
</html>
